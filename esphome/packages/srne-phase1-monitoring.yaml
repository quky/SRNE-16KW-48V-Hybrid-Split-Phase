  # ESPHome 2026.11.1 internal FC03 RAW readers; all starts are isolated.
  # response_size is BYTES; RAW words = (response_size + 1) / 2.
  # Apply reuse_previous_range: false on EVERY reader (also the following one).
  # Copy the full callback span into an owning vector at the script boundary.
  # No scalar value_type: the shared handler implements the approved U_WORD/S_WORD.
  # Single words: high byte first; no word swaps. Fault words are independent.
  # R01: 0x0100-0x0103, 4 word(s), cache[0:4].
  - platform: modbus_controller
    id: srne_phase1_reader_01
    modbus_controller_id: srne_phase1_controller
    internal: true
    register_type: holding
    address: 0x0100
    response_size: 8
    raw_encode: HEXBYTES
    reuse_previous_range: false
    lambda: |-
      id(srne_phase1_accept_group).execute(0, 0x0100, 4, 0, std::vector<uint8_t>(data.begin(), data.end()));
      return std::string{};

  # R02: 0x0107-0x0109, 3 word(s), cache[4:7].
  - platform: modbus_controller
    id: srne_phase1_reader_02
    modbus_controller_id: srne_phase1_controller
    internal: true
