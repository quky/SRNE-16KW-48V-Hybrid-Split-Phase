esphome:
  name: srne-bench-test
  friendly_name: SRNE Bench Test

packages:
  srne_phase1_monitoring: !include packages/srne-phase1-monitoring.yaml
  srne_phase2_diagnostics: !include packages/srne-phase2-diagnostics.yaml

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

sensor:
  - platform: uptime
    id: srne_uptime
    name: "Uptime"
    update_interval: 10s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none


api:
  encryption:
    key: !secret srne_api_key

ota:
  - platform: esphome
    password: !secret srne_ota_password



uart:
  id: uart_rs485
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 512

modbus:
  id: modbus1
  uart_id: uart_rs485
  flow_control_pin: GPIO21
  send_wait_time: 300ms
  turnaround_time: 200ms

